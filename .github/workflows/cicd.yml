name: CI/CD – Build, Push & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  ci:
    name: CI – Lint & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Django
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install flake8

      - name: Lint backend (flake8)
        run: |
          cd backend
          flake8 restaurant_backend \
            --max-line-length=120 \
            --exclude=__pycache__,migrations \
            --count --statistics

      - name: Django import & config sanity check
        env:
          DJANGO_SETTINGS_MODULE: restaurant_backend.config.settings
          MONGO_URI:              "mongodb://localhost:27017/testdb"
          MONGO_DB_NAME:          "testdb"
          DJANGO_SECRET_KEY:      "ci-test-key-not-real"
          DEBUG:                  "True"
          ALLOWED_HOSTS:          "localhost"
        run: |
          cd backend
          python -c "
          import django
          django.setup()
          print('Django OK')
          from restaurant_backend.reservations.models import Table, Reservation
          from restaurant_backend.reservations.serializers import TableSerializer, ReservationSerializer
          from restaurant_backend.reservations.views import TableListView, ReservationListView
          print('All imports OK')
          "

      # Angular
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type-check
        run: |
          cd frontend
          npx tsc --noEmit -p tsconfig.app.json

      # Orchestration file
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Capture short SHA (8 chars)
        id: sha
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & push backend (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context:    ./backend
          file:       ./backend/Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:${{ steps.sha.outputs.sha }}

      - name: Build & push frontend (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/restaurant-frontend:${{ steps.sha.outputs.sha }}
            
    deploy-k8s:
    name: Deploy – Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DEPLOY_K8S == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster connection
        run: kubectl cluster-info

      - name: Deploy to namespace "restaurant"
        env:
          DOCKER_USERNAME:     ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG:           ${{ needs.build-and-push.outputs.sha }}
          DJANGO_SECRET_KEY:   ${{ secrets.DJANGO_SECRET_KEY }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: bash k8s/deploy.sh
