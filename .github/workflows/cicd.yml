name: CI/CD – Build, Push & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI – Lint & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Django
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install flake8

      - name: Lint backend (flake8)
        run: |
          cd backend
          flake8 restaurant_backend \
            --max-line-length=120 \
            --exclude=__pycache__,migrations \
            --count --statistics

      - name: Django import & config sanity check
        env:
          DJANGO_SETTINGS_MODULE: restaurant_backend.config.settings
          MONGO_URI:              "mongodb://localhost:27017/testdb"
          MONGO_DB_NAME:          "testdb"
          DJANGO_SECRET_KEY:      "ci-test-key-not-real"
          DEBUG:                  "True"
          ALLOWED_HOSTS:          "localhost"
        run: |
          cd backend
          python -c "
          import django
          django.setup()
          print('Django OK')
          from restaurant_backend.reservations.models import Table, Reservation
          from restaurant_backend.reservations.serializers import TableSerializer, ReservationSerializer
          from restaurant_backend.reservations.views import TableListView, ReservationListView
          print('All imports OK')
          "

      # Frontend
      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type-check
        run: |
          cd frontend
          npx tsc --noEmit -p tsconfig.app.json

      # Orchestration
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Capture short SHA (8 chars)
        id: sha
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & push backend (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context:    ./backend
          file:       ./backend/Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:${{ steps.sha.outputs.sha }}

      - name: Build & push frontend (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/restaurant-frontend:${{ steps.sha.outputs.sha }}

  deploy-k8s:
    name: Deploy – Self-Hosted Kubernetes
    runs-on: self-hosted

    needs: build-and-push

    if: github.event_name != 'pull_request'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check kubectl
        run: kubectl version --client

      - name: Check Kubernetes context
        run: kubectl config current-context

      - name: Verify Kubernetes cluster
        run: kubectl cluster-info

      - name: Check cluster nodes
        run: kubectl get nodes

      - name: Create namespace
        run: kubectl apply -f k8s/00-namespace.yml

      - name: Create/update ConfigMaps
        run: kubectl apply -f k8s/01-configmaps.yml

      - name: Create/update Secrets
        shell: powershell
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: |
          kubectl create secret generic restaurant-secrets `
            --namespace restaurant `
            --from-literal=DJANGO_SECRET_KEY="$env:DJANGO_SECRET_KEY" `
            --from-literal=MONGO_ROOT_USERNAME="$env:MONGO_ROOT_USERNAME" `
            --from-literal=MONGO_ROOT_PASSWORD="$env:MONGO_ROOT_PASSWORD" `
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy MongoDB
        run: kubectl apply -f k8s/03-mongo-statefulset.yml

      - name: Deploy backend
        run: kubectl apply -f k8s/04-backend-deployment.yml

      - name: Deploy frontend
        run: kubectl apply -f k8s/05-frontend-deployment.yml

      - name: Deploy ingress
        run: kubectl apply -f k8s/06-ingress.yml

      - name: Update backend image
        run: |
          kubectl set image deployment/backend `
            backend=${{ secrets.DOCKER_USERNAME }}/restaurant-backend:${{ needs.build-and-push.outputs.sha }} `
            -n restaurant

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend `
            frontend=${{ secrets.DOCKER_USERNAME }}/restaurant-frontend:${{ needs.build-and-push.outputs.sha }} `
            -n restaurant

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend -n restaurant --timeout=180s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend -n restaurant --timeout=180s

      - name: Show deployed pods
        run: kubectl get pods -n restaurant

      - name: Show services
        run: kubectl get svc -n restaurant

      - name: Show ingress
        run: kubectl get ingress -n restaurant