# =============================================================================
# CI/CD Pipeline – restaurant-app  (GitHub Actions)
#
#   1. ci               flake8 + Django import check + TypeScript check +
#                       docker-compose.yml validation                (every push / PR)
#   2. build-and-push   Docker Buildx → DockerHub, tags: latest + short SHA
#                       (linux/amd64 + linux/arm64)                  (push to main/master)
#   3. deploy-compose   OPTIONAL CD – SSH to a VM: docker compose pull + up
#                       runs only if repository variable DEPLOY_COMPOSE = true
#   4. deploy-k8s       OPTIONAL CD – k8s/deploy.sh against your cluster
#                       runs only if repository variable DEPLOY_K8S = true
#
# Jobs 1–2 are the required CI part and only need the two DockerHub secrets.
# Jobs 3–4 are the bonus CD part; they are skipped until you enable them, so the
# pipeline is green out of the box.
#
# ─────────────────────────────────────────────────────────────────────────────
# GITHUB SECRETS   (Settings → Secrets and variables → Actions → Secrets)
#
#   Required (jobs 1–2)
#     DOCKER_USERNAME      DockerHub username
#     DOCKER_TOKEN         DockerHub access token (Account settings → Security)
#
#   Docker Compose deploy (job 3)
#     SSH_HOST             public IP / DNS of the server
#     SSH_USER             login user (e.g. ubuntu, azureuser)
#     SSH_PORT             SSH port (usually 22)
#     SSH_KEY              full private key (contents of ~/.ssh/id_ed25519)
#
#   Both CD jobs
#     DJANGO_SECRET_KEY    long random string   (openssl rand -hex 32)
#     MONGO_ROOT_PASSWORD  alphanumeric string  (openssl rand -hex 16)
#
#   Kubernetes deploy (job 4)
#     KUBECONFIG_B64       base64 -w0 ~/.kube/config  (cluster must be reachable
#                          from GitHub-hosted runners)
#
# GITHUB VARIABLES  (same page → Variables tab)
#     DEPLOY_COMPOSE       set to "true" to enable job 3
#     DEPLOY_K8S           set to "true" to enable job 4
# =============================================================================

name: CI/CD – Build, Push & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:

# =============================================================================
# JOB 1 – CI: lint + type-check + import sanity + compose validation
# =============================================================================
  ci:
    name: CI – Lint & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python / Django ────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install flake8

      - name: Lint backend (flake8)
        run: |
          cd backend
          flake8 restaurant_backend \
            --max-line-length=120 \
            --exclude=__pycache__,migrations \
            --count --statistics

      - name: Django import & config sanity check
        env:
          DJANGO_SETTINGS_MODULE: restaurant_backend.config.settings
          MONGO_URI:              "mongodb://localhost:27017/testdb"
          MONGO_DB_NAME:          "testdb"
          DJANGO_SECRET_KEY:      "ci-test-key-not-real"
          DEBUG:                  "True"
          ALLOWED_HOSTS:          "localhost"
        run: |
          cd backend
          python -c "
          import django
          django.setup()
          print('Django OK')
          from restaurant_backend.reservations.models import Table, Reservation
          from restaurant_backend.reservations.serializers import TableSerializer, ReservationSerializer
          from restaurant_backend.reservations.views import TableListView, ReservationListView
          print('All imports OK')
          "

      # ── Node / Angular ─────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type-check
        run: |
          cd frontend
          npx tsc --noEmit -p tsconfig.app.json

      # ── Orchestration file ─────────────────────────────────────────────────
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

# =============================================================================
# JOB 2 – Build & push images to DockerHub
# =============================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Capture short SHA (8 chars)
        id: sha
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & push backend (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context:    ./backend
          file:       ./backend/Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:${{ steps.sha.outputs.sha }}

      - name: Build & push frontend (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/restaurant-frontend:${{ steps.sha.outputs.sha }}

# =============================================================================
# JOB 3 – OPTIONAL CD: Docker Compose on a VM via SSH
#         (enable with repository variable DEPLOY_COMPOSE=true)
#
# One-time server preparation:
#   • install Docker Engine + Compose plugin
#   • sudo mkdir -p /opt/restaurant-app && sudo chown $USER /opt/restaurant-app
#   • open port 80 in the firewall / cloud security group
# =============================================================================
  deploy-compose:
    name: Deploy – Docker Compose (VM)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DEPLOY_COMPOSE == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port:     ${{ secrets.SSH_PORT }}
          key:      ${{ secrets.SSH_KEY }}
          source:   "docker-compose.yml,mongo-init/init.js"
          target:   "/opt/restaurant-app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG:           ${{ needs.build-and-push.outputs.sha }}
          DOCKER_USERNAME:     ${{ secrets.DOCKER_USERNAME }}
          DJANGO_SECRET_KEY:   ${{ secrets.DJANGO_SECRET_KEY }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          SERVER_HOST:         ${{ secrets.SSH_HOST }}
        with:
          host:        ${{ secrets.SSH_HOST }}
          username:    ${{ secrets.SSH_USER }}
          port:        ${{ secrets.SSH_PORT }}
          key:         ${{ secrets.SSH_KEY }}
          script_stop: true
          # variables listed here are exported on the remote shell
          envs: IMAGE_TAG,DOCKER_USERNAME,DJANGO_SECRET_KEY,MONGO_ROOT_PASSWORD,SERVER_HOST
          script: |
            set -e
            cd /opt/restaurant-app

            echo "=== Deploying restaurant-app  tag=${IMAGE_TAG} ==="

            # .env is read by docker-compose.yml – the pipeline pins the image tag
            cat > .env <<ENV
            DOCKER_USERNAME=${DOCKER_USERNAME}
            IMAGE_TAG=${IMAGE_TAG}
            FRONTEND_PORT=80
            DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
            DEBUG=False
            ALLOWED_HOSTS=localhost,127.0.0.1,${SERVER_HOST}
            MONGO_DB_NAME=restaurantdb
            MONGO_ROOT_USERNAME=admin
            MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
            ENV
            chmod 600 .env

            docker compose pull backend frontend
            docker compose up -d --remove-orphans --no-build

            echo "Waiting for the backend to become healthy (max 150 s)..."
            HEALTHY=false
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' restaurant-backend 2>/dev/null || echo "starting")
              echo "  [$i/30] $STATUS"
              if [ "$STATUS" = "healthy" ]; then HEALTHY=true; break; fi
              sleep 5
            done

            docker compose ps
            if [ "$HEALTHY" != "true" ]; then
              echo "Backend did not become healthy:"
              docker compose logs --tail=50 backend mongo
              exit 1
            fi

            docker image prune -f
            echo "Docker Compose deploy complete."

# =============================================================================
# JOB 4 – OPTIONAL CD: Kubernetes (enable with repository variable DEPLOY_K8S=true)
#
# Applies the manifests in k8s/ into the "restaurant" namespace via
# k8s/deploy.sh, with the image tag of this commit.
# =============================================================================
  deploy-k8s:
    name: Deploy – Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DEPLOY_K8S == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster connection
        run: kubectl cluster-info

      - name: Deploy to namespace "restaurant"
        env:
          DOCKER_USERNAME:     ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG:           ${{ needs.build-and-push.outputs.sha }}
          DJANGO_SECRET_KEY:   ${{ secrets.DJANGO_SECRET_KEY }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: bash k8s/deploy.sh
